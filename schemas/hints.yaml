$base: "https://eoap.github.io/cwl-mcp-extension#"

$namespaces:
  cwl: "https://w3id.org/cwl/cwl#"

$graph:
# Import the CWL v1.2 schema; adjust if you target another version
- $import: https://github.com/common-workflow-language/cwl-v1.2/raw/main/CommonWorkflowLanguage.yml

- name: Annotations
  type: record
  fields:
  - name: class
    type: string?
    doc: "Optional discriminator; when present, must be 'Annotations'."
    jsonldPredicate:
      _id: "@type"
      _type: "@vocab"
  - name: readOnlyHint
    type: boolean
  - name: destructiveHint
    type: boolean
  - name: idempotentHint
    type: boolean
  - name: openWorldHint
    type: boolean

- name: Tool
  type: record
  extends: cwl:ProcessRequirement
  inVocab: false
  doc: >-
      CWL hint describing an MCP tool's callable name, display title, behavioral
      annotations, and selection guidance. Input and output schemas are derived
      separately from the CWL process parameters.
  fields:
  - name: class
    type: string
    doc: "Always 'Tool'"
    jsonldPredicate:
      _id: "@type"
      _type: "@vocab"
  - name: name
    type: string
    jsonldPredicate: "@id"
    doc: Canonical callable name. This profile enforces MCP naming recommendations.
  - name: title
    type: string?
    doc: Human-readable display name overriding the CWL process label.
  - name: aliases
    type:
      type: array
      items: string
    doc: Discovery synonyms only; does not register additional callable names.
  - name: useWhen
    type: string
    doc: Conditions under which this tool should be selected.
  - name: doNotUseWhen
    type: string
    doc: Conditions under which this tool should NOT be selected.
  - name: annotations
    type: Annotations
