site_name: CWL 2 MCP
site_description: Derive validated MCP tool definitions from parsed CWL processes.
site_url: https://Transpiler-Mate.github.io/cwl2mcp/
repo_url: https://github.com/Transpiler-Mate/cwl2mcp
repo_name: cwl2mcp
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Generate your first MCP Tool: tutorials/first-steps.md
  - How-to guides:
      - Overview: how-to/index.md
      - Install: how-to/install.md
      - Configure output and metadata: how-to/configure-output.md
      - Use with MCP: how-to/use-with-mcp.md
  - Reference:
      - Overview: reference/index.md
      - Plugin and Python API: reference/api.md
      - CWL to MCP crosswalk: reference/crosswalk.md
      - Generated hint schema: reference/hints_schema.html
  - Explanation:
      - Overview: explanation/index.md
      - Architecture: explanation/architecture.md

theme:
  name: readthedocs
  highlightjs: true
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
